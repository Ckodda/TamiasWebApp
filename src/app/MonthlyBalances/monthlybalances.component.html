<ion-content class="ion-padding">
  <div class="ion-margin-bottom ion-flex ion-justify-content-between ion-align-items-center ion-flex-wrap" style="gap: 10px;">
    <ion-text color="dark">
      <h1 class="ion-no-margin" style="font-weight: bold;">Reporte de Balances</h1>
    </ion-text>
  </div>

  <!-- Sección de Filtros -->
  <ion-card class="ion-no-margin ion-margin-bottom" style="overflow: visible;">
    <ion-card-header>
      <ion-card-title class="ion-flex ion-align-items-center" style="font-size: 1.1rem; font-weight: 600;">
        <ion-icon name="filter-outline" slot="start" class="ion-margin-end"></ion-icon>
        Filtros de búsqueda
      </ion-card-title>
    </ion-card-header>
    <ion-card-content style="overflow: visible;">
      <form [formGroup]="form" (ngSubmit)="LoadData()">
        <ion-grid>
          <ion-row>
            <ion-col size="12" size-md="2">
              <ion-input
                mode="md"
                fill="outline"
                label="Fecha de Inicio"
                labelPlacement="stacked"
                type="date"
                formControlName="StartMonth"
                [errorText]="getErrorMessage('StartMonth')"
                [class.ion-invalid]="form.get('StartMonth')?.invalid && (form.get('StartMonth')?.touched || isSubmitted())"
                [class.ion-touched]="form.get('StartMonth')?.touched"
              ></ion-input>
            </ion-col>
            <ion-col size="12" size-md="2">
              <ion-input
                mode="md"
                fill="outline"
                label="Fecha de Fin"
                labelPlacement="stacked"
                type="date"
                formControlName="EndMonth"
                [errorText]="getErrorMessage('EndMonth')"
                [class.ion-invalid]="form.get('EndMonth')?.invalid && (form.get('EndMonth')?.touched || isSubmitted())"
                [class.ion-touched]="form.get('EndMonth')?.touched"
              ></ion-input>
            </ion-col>
            <ion-col size="12" size-md="3">
              <ion-select
                mode="md"
                fill="outline"
                label="Moneda"
                labelPlacement="stacked"
                formControlName="CurrencyId"
                placeholder="Seleccione..."
                interface="popover"
                [errorText]="getErrorMessage('CurrencyId')"
                [class.ion-invalid]="form.get('CurrencyId')?.invalid && (form.get('CurrencyId')?.touched || isSubmitted())"
                [class.ion-touched]="form.get('CurrencyId')?.touched"
              >
                <ion-select-option *ngIf="selectedCurrency() as sel" [value]="sel.Id">
                  {{ currencyLabelFn(sel) }}
                </ion-select-option>
                <app-searchable-select
                  slot="end"
                  placeholder="Buscar Moneda..."
                  [items]="currencies()"
                  [loading]="isSearchingCurrencies()"
                  [itemLabelFn]="currencyLabelFn"
                  [itemNoteFn]="currencyNoteFn"
                  (searchChange)="onCurrencySearchChange($event)"
                  (itemSelected)="onCurrencySelected($event)"
                ></app-searchable-select>
              </ion-select>
            </ion-col>
            <ion-col size="12" size-md="3">
              <ion-select
                mode="md"
                fill="outline"
                label="Centro de Costo"
                labelPlacement="stacked"
                formControlName="CostCenterId"
                placeholder="Seleccione..."
                interface="popover"
              >
                <ion-select-option [value]="null">Todos</ion-select-option>
                <ion-select-option *ngIf="selectedCostCenter() as sel" [value]="sel.Id">
                  {{ costCenterLabelFn(sel) }}
                </ion-select-option>
                <app-searchable-select
                  slot="end"
                  placeholder="Buscar Centro de Costo..."
                  [items]="costCenters()"
                  [loading]="isSearchingCostCenters()"
                  [itemLabelFn]="costCenterLabelFn"
                  [itemNoteFn]="costCenterNoteFn"
                  (searchChange)="onCostCenterSearchChange($event)"
                  (itemSelected)="onCostCenterSelected($event)"
                ></app-searchable-select>
              </ion-select>
            </ion-col>
            <ion-col size="12" size-md="2" class="ion-align-self-center">
                <ion-button type="submit" expand="block" [disabled]="isLoading()">
                  <ion-icon slot="start" name="search-outline" *ngIf="!isLoading()"></ion-icon>
                  <ion-spinner slot="start" name="crescent" size="small" *ngIf="isLoading()"></ion-spinner>
                  {{ isLoading() ? 'Buscando...' : 'Buscar' }}
                </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </form>
    </ion-card-content>
  </ion-card>
     <app-table
     [items]="monthlyBalances()"
     [columns]="columns"
     [isLoading]="isLoading()"
     [totalCount]="totalCount()"
     [pageNumber]="form.value.PageNumber!"
     [pageSize]="form.value.PageSize!"
     totalLabel="'registros'"
     (pageChange)="onTablePageChange($event)"
     (pageSizeChange)="onTablePageSizeChange($event)"
     ></app-table>
</ion-content>
